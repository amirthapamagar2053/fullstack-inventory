<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Pro — Login</title>

  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/login.css" />
</head>

<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-name">Inventory Pro</div>
        <div class="login-brand-subtitle">Sign in to manage your inventory</div>
      </div>

      <form class="login-form" id="loginForm">
        <div class="login-field" id="nameField" hidden>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>

        <div class="login-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <small class="login-hint" id="passwordHint" hidden>At least 8 characters.</small>
        </div>

        <div class="login-error" id="loginError"></div>

        <button class="login-submit" type="submit" id="loginSubmit">Sign In</button>

        <p class="login-alt">
          <span id="loginAltText">Need an account?</span>
          <button type="button" class="login-link" id="modeToggle">Create one</button>
        </p>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>

</html>
