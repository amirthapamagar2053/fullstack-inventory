<header class="header">
  <div class="header-search">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="4.3" />
        <path d="M10.2 10.2 14 14" />
      </svg>
    </span>
    <input id="searchInput" type="text" placeholder="Search Item Name..." />
  </div>

  <div class="header-filters" aria-label="Inventory filters">
    <select id="categoryFilter" class="header-filter" aria-label="Category filter"></select>
    <select id="locationFilter" class="header-filter" aria-label="Location filter"></select>
  </div>

  <div class="header-actions">
    <button class="icon-button" type="button" aria-label="Notifications">
      <span aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2.2a3 3 0 0 0-3 3v1.8c0 .8-.3 1.6-.8 2.2l-.4.5h8.4l-.4-.5a3.5 3.5 0 0 1-.8-2.2V5.2a3 3 0 0 0-3-3Z" />
          <path d="M6.4 12a1.8 1.8 0 0 0 3.2 0" />
        </svg>
      </span>
      <span class="notification-dot"></span>
    </button>
    <button class="icon-button" type="button" aria-label="Settings">
      <span aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="8" r="2.3" />
          <path d="M8 1.7v1.2M8 13.1v1.2M1.7 8h1.2M13.1 8h1.2M3.4 3.4l.9.9M11.7 11.7l.9.9M12.6 3.4l-.9.9M4.3 11.7l-.9.9" />
        </svg>
      </span>
    </button>
    <div class="avatar" id="userAvatar" aria-label="Profile">
      <img alt="Profile" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='24' fill='%23d7a37e'/%3E%3Ccircle cx='24' cy='18' r='9' fill='%23f6e7da'/%3E%3Cpath d='M10 42c2.9-9 8.5-14 14-14s11.1 5 14 14' fill='%23f6e7da'/%3E%3C/svg%3E" />
    </div>
  </div>
</header>
