databases:
  - name: inventory-db
    plan: free
    region: oregon
    databaseName: inventory_db
    user: inventory

services:
  - type: web
    name: inventory-api
    runtime: node
    plan: free
    region: oregon
    rootDir: BE
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      # Initial admin login, created on first boot. Change these in the Render
      # dashboard (and redeploy with a fresh database) for anything real.
      - key: SEED_ADMIN_EMAIL
        value: testuser@example.com
      - key: SEED_ADMIN_PASSWORD
        value: TestUser123!
      - key: SEED_ADMIN_NAME
        value: Test User

  - type: web
    name: inventory-ui
    runtime: static
    staticPublishPath: ./FE
    buildCommand: ./scripts/build-ui.sh
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: inventory-api
          property: host
