databases:
  - name: inventory-db
    plan: free
    region: oregon
    databaseName: inventory_db
    user: inventory

services:
  - type: web
    name: inventory-api
    runtime: node
    plan: free
    region: oregon
    rootDir: BE
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod:migrate
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
